<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Site com Cookies</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      transition: background 0.5s, color 0.5s;
    }

    body.blocked {
      background: #000;
      color: #000;
      pointer-events: none;
      user-select: none;
    }

    .content {
      padding: 40px;
    }

    .cookie-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 90%;
      z-index: 9999;
    }

    .cookie-box button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .accept {
      background: #00ff88;
    }

    .reject {
      background: #ff4444;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="content">
    <h1>Meu site brabo</h1>
    <p>Conteúdo normal do site. Se não aceitar os cookies, já era.</p>
  </div>

  <div class="cookie-box" id="cookieBox">
    <p>Esse site usa cookies. Se aceitar, entra de boa. Se não aceitar ou der merda, o site vira um breu total.</p>
    <button class="accept" onclick="acceptCookies()">Aceitar</button>
    <button class="reject" onclick="rejectCookies()">Recusar</button>
  </div>

  <script>
    function acceptCookies() {
      try {
        localStorage.setItem('cookiesAccepted', 'true');
        document.getElementById('cookieBox').remove();
      } catch (e) {
        blockSite();
      }
    }

    function rejectCookies() {
      blockSite();
    }

    function blockSite() {
      document.body.classList.add('blocked');
      document.getElementById('cookieBox').remove();
    }

    // verifica ao carregar
    window.onload = () => {
      try {
        if (localStorage.getItem('cookiesAccepted') === 'true') {
          document.getElementById('cookieBox').remove();
        }
      } catch (e) {
        blockSite();
      }
    }
  </script>

</body>
</html>
